[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "trxasviewer"
dynamic = ["version"]
description = "A python GUI for visualizing Time Resolved X-ray Absorption Spectroscopy datasets"
readme = "README.rst"
authors = [{ name = "Miaoqi Chu", email = "mqichu@anl.gov" }]
maintainers = [{ name = "Miaoqi Chu", email = "mqichu@anl.gov" }]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]

license = { text = "Apache-2.0" }
keywords = [
    "X-ray absorption",
    "spectroscopy",
    "time-resolved",
    "synchrotron",
    "visualization",
    "science",
]

dependencies = [
    "numpy",
    "pyqtgraph",
    "matplotlib",
    "scienceplots",
    "scipy",
    "h5py",
    "pandas",
    "PySide6",
    "psutil",
]

[project.scripts]
trxasviewer = "trxasviewer.cli:main"

[project.optional-dependencies]
dev = ["coverage", "pytest", "pytest-cov", "mypy", "ruff", "twine", "pytest-qt"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
bugs = "https://github.com/AZjk/trxasviewer/issues"
changelog = "https://github.com/AZjk/trxasviewer/blob/master/changelog.md"
homepage = "https://github.com/AZjk/trxasviewer"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-timestamp"

[tool.setuptools.package-data]
"*" = ["*.*"]

# Ruff
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["**/generated_ui.py", "**/generated_modeling_ui.py"]

# Mypy
[tool.mypy]
files = "."
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"
