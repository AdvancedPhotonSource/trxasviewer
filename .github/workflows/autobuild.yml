name: Build and Publish Python Package

on:
  push:
    tags:
      - 'v*'  # Trigger only when a version tag is pushed
  workflow_dispatch:  # Allows manual triggering from GitHub UI, e.g. to publish an existing tag
    inputs:
      publish:
        description: "Publish the build to PyPI"
        type: boolean
        required: false
        default: false
      version:
        description: "Override the package version (e.g. 0.6.1), instead of deriving it from git tags on this ref"
        type: string
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7  # Get the repository code

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Override package version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Build the Python Package
        run: python -m build

      - name: Upload Built Package as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-package
          path: dist/

      - name: Publish to PyPI
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
